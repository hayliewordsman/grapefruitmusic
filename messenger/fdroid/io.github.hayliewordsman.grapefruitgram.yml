# DRAFT F-Droid build recipe for Grapefruitgram Messenger: not yet built or reviewed by F-Droid.
# It needs a TelegramX srclib (git, with submodules) in fdroiddata, and Grapefruitgram's own Telegram
# API credentials. The first release fills in versionName, versionCode and commit. See messenger/README.md.
Categories:
  - Internet
  - Phone & SMS
License: GPL-3.0-or-later
AuthorName: MagicFlute LLC
WebSite: https://hayliewordsman.github.io/grapefruitmusic/
SourceCode: https://github.com/hayliewordsman/grapefruitmusic/tree/HEAD/messenger
IssueTracker: https://github.com/hayliewordsman/grapefruitmusic/issues

AutoName: Grapefruitgram Messenger

RepoType: git
Repo: https://github.com/hayliewordsman/grapefruitmusic.git

Builds:
  - versionName: 0.28.x-grapefruitgram1
    versionCode: 1826
    commit: messenger-v1
    subdir: messenger
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-25-jdk-headless rustup cmake ninja-build
      - update-alternatives --auto java
    srclibs:
      - TelegramX@bf82021249e358337b8e4d3f219e0d2c9561eb79
    ndk: 23.2.8568313
    prebuild:
      # The pinned Telegram X becomes the source tree, with Grapefruitgram's patches applied;
      # TDLib and OpenSSL are rebuilt from source there (no prebuilt native libraries).
      - rm -rf ../work/messenger && mkdir -p ../work && cp -a $$TelegramX$$ ../work/messenger
      - TELEGRAM_API_ID=$$GRAPEFRUITGRAM_API_ID$$ TELEGRAM_API_HASH=$$GRAPEFRUITGRAM_API_HASH$$ ./prepare.sh --no-fetch --tdlib source ../work/messenger
      - cd ../work/messenger && scripts/setup-rust.sh
    build:
      - cd ../work/messenger && ./gradlew :app:assembleLegacyRelease -PuseLegacyNdk=true -Pabi=arm32,x86
    output: ../work/messenger/app/build/outputs/apk/legacy/release/*.apk

AllowedAPKSigningKeys: 85cac0ef72777211d99e2bbe4ad09a3815c6cf313e5fa18f401ec8da0ae0e795

MaintainerNotes: |-
  Grapefruitgram Messenger is Telegram X (GPL-3.0-or-later) at a pinned commit
  (messenger/upstream.properties) with the patches, new files and deletions in
  messenger/ applied by messenger/prepare.sh. The FOSS build removes Firebase,
  Google Play services, ML Kit, Play Integrity, reCAPTCHA, Play Billing, Play
  In-App Updates and Huawei HMS (and their Gradle coordinates), and uses
  UnifiedPush (connector 2.5.0, Apache-2.0), osmdroid 6.1.20 (Apache-2.0,
  OpenStreetMap tiles), Android's LocationManager and ZXing instead.
  TDLib (BSL-1.0) and OpenSSL are built from source by tdlib/source/rebuild.sh.
  The Telegram API credentials are Grapefruitgram's own (as Telegram-FOSS
  publishes its own). Release builds fetch translations from
  translations.telegram.org, as upstream Telegram X does.

AutoUpdateMode: None
UpdateCheckMode: Tags ^messenger-v[0-9]+$
AntiFeatures:
  NonFreeNet:
    en-US: Uses Telegram's servers, which are not free software.
