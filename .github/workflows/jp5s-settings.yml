name: JP5S theme companions
on:
  push:
    branches: [codex/jp5s-grapefruit-settings]
    paths: ['app/src/**', 'tv/src/**', 'launcher/src/**', 'grapefruit-ui/**', 'settings/**', 'tools/settings/**', '.github/workflows/jp5s-settings.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  companions:
    if: github.ref_name == 'codex/jp5s-grapefruit-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare existing Grapefruit app signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'The existing app signing secret is required for installable companion updates.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit.p12"
          echo "GRAPEFRUIT_KEYSTORE=$RUNNER_TEMP/grapefruit.p12" >> "$GITHUB_ENV"
      - name: Check Settings UI and build signed companions
        env:
          GRAPEFRUIT_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :settings:testDebugUnitTest :settings:lintDebug :app:assembleRelease :tv:assembleRelease :launcher:assembleRelease
      - name: Verify and place companion APKs on the JP5S branch
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p downloads/jp5s
          for module in app tv launcher; do
            apk="$module/build/outputs/apk/release/$module-release.apk"
            digest=$("$tools/apksigner" verify --print-certs --min-sdk-version 17 "$apk" | sed -n 's/^.*certificate SHA-256 digest: *//p' | sort -u)
            test "$digest" = 85cac0ef72777211d99e2bbe4ad09a3815c6cf313e5fa18f401ec8da0ae0e795
          done
          cp app/build/outputs/apk/release/app-release.apk downloads/jp5s/Grapefruit-Audio-universal-theme.apk
          cp tv/build/outputs/apk/release/tv-release.apk downloads/jp5s/Grapefruit-TV-universal-theme.apk
          cp launcher/build/outputs/apk/release/launcher-release.apk downloads/jp5s/Grapefruit-Launcher-universal-theme.apk
          (cd downloads/jp5s && sha256sum *.apk > SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/jp5s
          if ! git diff --cached --quiet; then
            git commit -m 'JP5S: signed universal theme companion APKs [skip ci]'
            git push origin HEAD:codex/jp5s-grapefruit-settings
          fi
      - name: Remove app signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit.p12"
