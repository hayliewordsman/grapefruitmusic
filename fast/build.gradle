plugins { id "com.android.application" }
android {
    namespace "com.grapefruitfast"
    compileSdk 36
    defaultConfig {
        applicationId "io.github.hayliewordsman.grapefruitfast"
        minSdk 17
        targetSdk 36
        versionCode 9
        versionName "1.0-beta-9"
        ndk { abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64" }
    }
    signingConfigs {
        // The permanent Grapefruit key (the same one Music is signed with), kept out of the repository.
        // Builds find it through GRAPEFRUIT_KEYSTORE (path to the .p12) and GRAPEFRUIT_KEYSTORE_PASSWORD.
        // Every build that has it, debug and release, beta and stable, is signed with it, so each one
        // installs over the last. Without it the release APK is unsigned and debug uses the debug key.
        permanent {
            def key = System.getenv("GRAPEFRUIT_KEYSTORE")
            if (key) {
                storeFile file(key)
                storeType "pkcs12"
                storePassword System.getenv("GRAPEFRUIT_KEYSTORE_PASSWORD")
                keyAlias "grapefruit"
                keyPassword System.getenv("GRAPEFRUIT_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("GRAPEFRUIT_KEYSTORE")) signingConfig signingConfigs.permanent
        }
        debug {
            if (System.getenv("GRAPEFRUIT_KEYSTORE")) signingConfig signingConfigs.permanent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { jniLibs { keepDebugSymbols += "**/libconscrypt_jni.so" } }
    dependenciesInfo { includeInApk false; includeInBundle false }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testHome = layout.buildDirectory.dir("test-home").get().asFile
            systemProperty "user.home", testHome.absolutePath
            systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
            systemProperty "fast.capture", System.getProperty("fast.capture", "false")
            doFirst { testHome.mkdirs() }
        }
    }
    lint { abortOnError true }
}
dependencies {
    implementation project(":grapefruit-ui")
    // 2.18.x retains API 16 support; 2.19 and Media3 require newer Android.
    implementation "com.google.android.exoplayer:exoplayer-core:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-hls:2.18.7"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "org.json:json:20240303"
}
