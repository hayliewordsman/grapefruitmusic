plugins {
    id "com.android.application"
}

android {
    namespace "com.grapefruitmusic"
    compileSdk 36

    defaultConfig {
        // From the developer's GitHub Pages address (hayliewordsman.github.io), as F-Droid asks. The
        // code stays in the com.grapefruitmusic package (namespace above).
        applicationId "io.github.hayliewordsman.grapefruitmusic"
        // Android 4.2.2 (Jelly Bean MR1).
        minSdk 17
        // Modern behavior is version-gated; minSdk stays at Jelly Bean MR1.
        targetSdk 36
        versionCode 39
        versionName "4.1-beta-1"

        ndk {
            // Keep old 32-bit devices and modern 64-bit-only phones supported.
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        // The permanent release key, kept out of the repository. Builds find it through
        // GRAPEFRUIT_KEYSTORE (path to the .p12 file) and GRAPEFRUIT_KEYSTORE_PASSWORD.
        release {
            def keystore = System.getenv("GRAPEFRUIT_KEYSTORE")
            if (keystore) {
                storeFile = file(keystore)
                storeType = "pkcs12"
                storePassword = System.getenv("GRAPEFRUIT_KEYSTORE_PASSWORD")
                keyAlias = "grapefruit"
                keyPassword = System.getenv("GRAPEFRUIT_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the release key when the build has it. Without it (F-Droid's build server,
            // forks, pull requests) the release APK is left unsigned, as F-Droid expects; the debug
            // APK still installs for testing.
            if (System.getenv("GRAPEFRUIT_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // Conscrypt's native library goes in exactly as published, never stripped: whether a build
            // machine happens to have the NDK to strip it must not change the APK (reproducible builds).
            keepDebugSymbols += "**/libconscrypt_jni.so"
        }
    }

    dependenciesInfo {
        // No dependency list encrypted for Google in the APK: nothing reads it outside Google Play,
        // and F-Droid asks apps to leave it out.
        includeInApk = false
        includeInBundle = false
    }

    lint {
        // The low targetSdk is deliberate (see defaultConfig).
        disable "ExpiredTargetSdkVersion", "OldTargetApi"
        abortOnError true
    }
}

dependencies {
    // Modern TLS (1.2/1.3, AEAD ciphers) on Android 4.2.2, whose built-in TLS stack
    // can't talk to most HTTPS servers any more.
    implementation "org.conscrypt:conscrypt-android:2.5.3"

    testImplementation "junit:junit:4.13.2"
}
