name: Grapefruit Launcher

on:
  push:
    paths:
      - 'launcher/**'
      - 'grapefruit-ui/**'
      - 'tools/launcher/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'grapefruit-ui/**'
      - 'tools/launcher/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --no-daemon :launcher:assembleDebug :launcher:assembleRelease :launcher:testDebugUnitTest :launcher:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-launcher-apks
          path: launcher/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grapefruit-launcher-reports
          path: |
            launcher/build/reports/tests/testDebugUnitTest/
            launcher/build/reports/lint-results-debug.html
          if-no-files-found: ignore
