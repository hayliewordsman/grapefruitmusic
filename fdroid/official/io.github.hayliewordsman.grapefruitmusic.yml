MaintainerNotes: |-
  app/src/main/assets/karaoke.bin (SHA-256 c5f4e22b06c0e3ce7011b0daa290f1ff7ff22b2a3c1b24cb7fa2ba3495cf1e3a)
  is the weights of Karaoke Mode's small vocal-removal network: data read by
  VocalRemover.Model.read, not executable code. tools/karaoke in the source repository trained it on
  the MUSDB18 7-second excerpts (CC BY 4.0, https://zenodo.org/records/3270814) and Free Music
  Archive songs under CC BY, CC0 or public domain, split into voice and backing by Demucs (MIT);
  tools/karaoke/README.md explains how to rebuild it, and the app credits the songs.
  app/src/test/resources holds unit-test fixtures only.

