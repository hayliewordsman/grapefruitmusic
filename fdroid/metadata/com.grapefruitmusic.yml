Name: Grapefruit Music
Summary: Music player for your own files and Navidrome, Subsonic and Jellyfin servers
Description: |-
  Grapefruit Music is a small, native music player for Android 4.2.2 (Jelly Bean) and later,
  styled after the iOS 10 Music app. It plays music you own: files on your device, and your own
  Navidrome, Subsonic or Jellyfin servers.

  * Download albums, playlists and songs for offline listening
  * Time-synced lyrics from .lrc files, your server or LRCLIB
  * Internet radio from the Radio Browser directory, and FM radio on tablets with a supported tuner
  * Volume Match, Volume Boost, a 10-band equalizer, Mono Audio and Karaoke Mode
  * Edit song tags and artwork
  * Four themes, each with its own app icon

  Grapefruit draws its own controls, so it looks the same on every Android version, and brings
  its own modern TLS, so it can still reach today's HTTPS servers on Android 4.2.
