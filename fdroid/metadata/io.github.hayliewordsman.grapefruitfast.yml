# Grapefruit TV & Movies' listing (formerly Grapefruit TV and Grapefruit FAST; the application ID keeps that name) in Grapefruit's F-Droid repository, beside Grapefruit Audio.
# The name, summary, description, icon and each version's "What's new" come from
# tv/fastlane/metadata/android/en-US, which the workflow copies beside this file as
# io.github.hayliewordsman.grapefruitfast/en-US before running fdroid update. It also adds
# CurrentVersionCode (FAST's newest APK in the repo). Categories are defined in config/categories.yml.

License: GPL-3.0-or-later
Categories:
  - Online Media Player

# Live streams come from broadcasters' and distributors' services, which carry their own ads.
AntiFeatures:
  Ads:
    en-US: Built-in channels' own advertisements play in their streams. Grapefruit TV & Movies adds none of its own.
  NonFreeNet:
    en-US: Plays live channels from broadcasters' and distributors' streaming services, and films from the Internet Archive.

AuthorName: MagicFlute LLC
SourceCode: https://github.com/hayliewordsman/grapefruitmusic/tree/HEAD/tv
IssueTracker: https://github.com/hayliewordsman/grapefruitmusic/issues
Changelog: https://github.com/hayliewordsman/grapefruitmusic/releases
Donate: https://paypal.me/fishglub
