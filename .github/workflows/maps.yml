name: Grapefruit Maps
on:
  push:
    paths: ["maps/**", "grapefruit-ui/**", "tools/maps/**", "settings.gradle", "build.gradle", "gradle/**", ".github/workflows/maps.yml"]
  pull_request:
    paths: ["maps/**", "grapefruit-ui/**", "tools/maps/**", "settings.gradle", "build.gradle", "gradle/**", ".github/workflows/maps.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Maps version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\([^"]*\)" *$/\1/p' maps/build.gradle)
          [[ "$name" =~ ^[0-9A-Za-z.-]+$ ]]
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "MAPS_VERSION=$name" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK and offline map test fixture
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          mkdir -p work/maps-beta
          curl --fail --location --retry 3 https://download.mapsforge.org/maps/v5/europe/andorra.map -o work/maps-beta/andorra.map
      - name: Use permanent Grapefruit certificate when available
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit.p12"
            echo "GRAPEFRUIT_KEYSTORE=$RUNNER_TEMP/grapefruit.p12" >> "$GITHUB_ENV"
          fi
      - name: Build beta, test and lint
        env:
          GRAPEFRUIT_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :maps:assembleBeta :maps:testBetaUnitTest :maps:lintBeta
      - name: Verify installable Android 4.2.2 APK
        run: |
          mkdir -p work/maps-apk
          cp maps/build/outputs/apk/beta/maps-beta.apk "work/maps-apk/grapefruit-maps-$MAPS_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 17 "work/maps-apk/grapefruit-maps-$MAPS_VERSION.apk" > work/maps-apk/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "work/maps-apk/grapefruit-maps-$MAPS_VERSION.apk" > work/maps-apk/package.txt
          if [ -n "$GRAPEFRUIT_KEYSTORE" ]; then
            digest=$(sed -n 's/^.*certificate SHA-256 digest: *//p' work/maps-apk/signature.txt | sort -u)
            test "$digest" = 85cac0ef72777211d99e2bbe4ad09a3815c6cf313e5fa18f401ec8da0ae0e795
          fi
          cd work/maps-apk
          sha256sum "grapefruit-maps-$MAPS_VERSION.apk" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-maps-${{ steps.version.outputs.name }}
          path: work/maps-apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grapefruit-maps-reports
          path: |
            maps/build/reports/
            maps/build/test-results/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit.p12"
  beta-release:
    # Beta publication is confined to the user-requested Maps branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/maps-beta-1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grapefruit-maps-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish verified Maps beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -f "maps/RELEASE-${VERSION#1.0-}.md"
          (cd artifacts && sha256sum --check SHA256SUMS)
          if gh release view "maps-v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; leaving the existing release intact.'
            exit 0
          fi
          gh release create "maps-v$VERSION" "artifacts/grapefruit-maps-$VERSION.apk" artifacts/SHA256SUMS artifacts/signature.txt \
            --target "$GITHUB_SHA" --title "Grapefruit Maps $VERSION" \
            --notes-file "maps/RELEASE-${VERSION#1.0-}.md" --prerelease --latest=false
