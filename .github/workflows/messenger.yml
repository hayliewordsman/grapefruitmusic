name: Grapefruitgram Messenger
on:
  push:
    paths: ["messenger/**", "grapefruit-ui/src/main/assets/fonts/**", ".github/workflows/messenger.yml"]
  pull_request:
    paths: ["messenger/**", "grapefruit-ui/src/main/assets/fonts/**", ".github/workflows/messenger.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Fast: the generated themes, and that the patch set still applies to the pinned Telegram X.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme tests
        run: python3 -m unittest discover -s messenger/tools -p 'test_*.py' -v
      - name: Pinned Telegram X (without submodules)
        run: |
          url=$(sed -n 's/^url=//p' messenger/upstream.properties)
          commit=$(sed -n 's/^commit=//p' messenger/upstream.properties)
          git init -q work/upstream
          git -C work/upstream fetch -q --depth 1 "$url" "$commit"
          git -C work/upstream checkout -q FETCH_HEAD
      - name: Generated themes are up to date
        run: |
          python3 messenger/tools/themes.py work/upstream
          git diff --exit-code -- messenger/overlay
      - name: Patches, overlay and deletions apply
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          ANDROID_HOME="$RUNNER_TEMP/sdk" RUSTUP_HOME="$HOME/.rustup" \
            messenger/prepare.sh --no-fetch --tdlib none --sample-api-id work/upstream
          # Nothing proprietary is left for F-Droid's scanner (or anyone) to find.
          if grep -rnE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|android\.recaptcha)|com\.android\.billingclient|com\.huawei' \
            work/upstream/app/build.gradle.kts work/upstream/build.gradle.kts work/upstream/gradle/libs.versions.toml \
            work/upstream/app/src work/upstream/extension --include='*.kts' --include='*.toml' --include='*.java' --include='*.kt'; then
            echo "::error::Proprietary libraries are referenced (above)"
            exit 1
          fi

  build:
    # The APK for Android 4.2.2 and later (Telegram X's "legacy" flavor: minSdk 16, NDK r23).
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space (Telegram X needs ~25 GB to build)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK, NDK r23 and CMake
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;23.2.8568313' 'cmake;3.22.1'
      - name: Use permanent Grapefruit certificate when available
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit.p12"
            echo "GRAPEFRUIT_KEYSTORE=$RUNNER_TEMP/grapefruit.p12" >> "$GITHUB_ENV"
          fi
      - name: Prepare Grapefruitgram source
        env:
          TELEGRAM_API_ID: ${{ secrets.GRAPEFRUITGRAM_TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.GRAPEFRUITGRAM_TELEGRAM_API_HASH }}
          GRAPEFRUIT_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: |
          flags=()
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::warning::GRAPEFRUITGRAM_TELEGRAM_API_ID/HASH secrets are not set: building a test APK with Telegram X's sample credentials. Do not distribute it."
            flags+=(--sample-api-id)
          fi
          RUSTUP_HOME="$HOME/.rustup" messenger/prepare.sh "${flags[@]}" work/messenger
      - name: Rust for the Android 4.x ABIs (version.rust of the pinned Telegram X)
        run: |
          rust=$(sed -n 's/^version.rust=//p' work/messenger/version.properties)
          rustup toolchain install "$rust" --profile minimal --target armv7-linux-androideabi,i686-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android 4.2.2+ APK (ARMv7 and x86)
        working-directory: work/messenger
        run: ./gradlew --no-daemon :app:assembleLegacyRelease -PuseLegacyNdk=true -Pabi=arm32,x86
      - name: Verify and checksum
        run: |
          mkdir -p work/messenger-apk
          find work/messenger/app/build/outputs/apk -name '*.apk' -exec cp {} work/messenger-apk/ \;
          cd work/messenger-apk
          for apk in *.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" | grep -E "^package:|sdkVersion|application-label:" | tee "$apk.badging.txt"
            grep -q "sdkVersion:'16'" "$apk.badging.txt"
            if "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs --min-sdk-version 17 "$apk" > "$apk.signature.txt" 2>&1; then
              echo "$apk is signed"
            else
              echo "$apk is unsigned"
            fi
          done
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruitgram-messenger
          path: work/messenger-apk/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit.p12" work/messenger/keystore.properties
