MaintainerNotes: |-
  Only the maps module is built. Unused app, tv and blue-victory modules are
  deleted and removed from settings.gradle before building; grapefruit-ui is a GPL shared source
  module supplying TLS, OFL fonts and the optional read-only universal theme client.
  Runtime dependencies are Mapsforge 0.21.0 (LGPL-3.0 with upstream waiver),
  AndroidSVG 1.4 (Apache-2.0), Conscrypt 2.5.3 (Apache-2.0/BoringSSL notices)
  and Geist/Geist Pixel (OFL-1.1). The fonts and generated sprite PNG are
  editable assets, not executable binaries. Their licenses, source artwork,
  prompts and packaging recipes are included under maps/brand and tools/maps.
  No model or image service is required by the build or app.
  The app uses public OSM/Nominatim/OSRM/NASA services with configurable
  search and routing servers. Country extracts are downloaded from Mapsforge;
  no map database is bundled. Satellite imagery is NASA's static Blue Marble.
  The optional Victory Blue game contains a satirical public-figure caricature.
  The certificate subject is Android Debug, but its fingerprint pins the private
  signing key already used for the developer's other Grapefruit releases.

