name: Grapefruit TV
on:
  push:
    paths: ["tv/**", "grapefruit-ui/**", "tools/tv/**", "docs/tv/**", "build.gradle", "settings.gradle", "gradle.properties", "gradle/**", ".github/workflows/tv.yml"]
  pull_request:
    paths: ["tv/**", "grapefruit-ui/**", "tools/tv/**", "docs/tv/**", "build.gradle", "settings.gradle", "gradle.properties", "gradle/**", ".github/workflows/tv.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed GitHub release from the default branch
        type: boolean
        default: false
permissions:
  contents: read
env:
  # SHA-256 of the permanent Grapefruit certificate (as in fdroid-repo.yml): Music and Grapefruit TV are both signed with it.
  GRAPEFRUIT_CERT_SHA256: 85cac0ef72777211d99e2bbe4ad09a3815c6cf313e5fa18f401ec8da0ae0e795
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test stream checker (offline)
        run: python3 -m unittest discover -s tools/tv -p 'test_*.py' -v
      - name: Read Grapefruit TV version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\([^"]*\)" *$/\1/p' tv/build.gradle)
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The permanent Grapefruit key, the same secrets Music's workflow uses. Every Grapefruit TV build that has it
      # (test and release, beta and stable) is signed with it, so each installs over the one before.
      - name: Permanent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit.p12"
            echo "GRAPEFRUIT_KEYSTORE=$RUNNER_TEMP/grapefruit.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, test and lint Grapefruit TV
        env:
          GRAPEFRUIT_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :tv:assembleDebug :tv:assembleRelease :tv:testDebugUnitTest :tv:lintDebug
      - name: Package installable test APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p work/fast-test-apk
          apk=work/fast-test-apk/grapefruit-tv-${{ steps.version.outputs.name }}-test.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ "$SIGNED" = true ]; then
            # The release build, on the permanent key: it installs over earlier and later Grapefruit TV builds.
            cp tv/build/outputs/apk/release/fast-release.apk "$apk"
            digest=$("$tools/apksigner" verify --print-certs --min-sdk-version 17 "$apk" | sed -n 's/^.*certificate SHA-256 digest: *//p' | sort -u)
            test "$digest" = "$GRAPEFRUIT_CERT_SHA256"
          else
            # No key here (a fork's pull request): debug-signed, and it won't install over permanent-key builds.
            cp tv/build/outputs/apk/debug/fast-debug.apk "$apk"
            echo "::warning::No permanent key: this test APK is debug-signed and won't install over signed Grapefruit TV builds."
          fi
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 17 "$apk" > work/fast-test-apk/signature.txt
          "$tools/aapt2" dump badging "$apk" > work/fast-test-apk/package.txt
          (cd work/fast-test-apk && sha256sum grapefruit-tv-${{ steps.version.outputs.name }}-test.apk > SHA256SUMS)
          cp docs/tv/validation.md work/fast-test-apk/verification.md
          cp docs/tv/stream-report.json docs/tv/codec-report.json work/fast-test-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-tv-${{ steps.version.outputs.name }}-test-apk
          path: work/fast-test-apk/
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-tv-apk
          path: tv/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grapefruit-tv-reports
          path: |
            tv/build/reports/
            tv/build/test-results/
          if-no-files-found: ignore
  release:
    # Explicit publication prevents an unrelated shared-library change releasing Grapefruit TV.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # starts the F-Droid repo workflow, which publishes the new release there
    steps:
      - uses: actions/checkout@v4
      - name: Require the permanent key
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: test "$SIGNED" = true
      - uses: actions/download-artifact@v4
        with:
          name: grapefruit-tv-apk
          path: artifacts
      - name: Verify package and signature
        env:
          EXPECTED_CERT: ${{ env.GRAPEFRUIT_CERT_SHA256 }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$EXPECTED_CERT"
          apk=artifacts/release/fast-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          digest=$("$tools/apksigner" verify --print-certs --min-sdk-version 17 "$apk" | sed -n 's/^.*certificate SHA-256 digest: *//p' | sort -u)
          test "$digest" = "$EXPECTED_CERT"
          "$tools/aapt2" dump badging "$apk" > badging.txt
          head -n 1 badging.txt | grep -qF "package: name='io.github.hayliewordsman.grapefruitfast'"
          cp "$apk" "grapefruit-tv-$VERSION.apk"
      - name: Publish the Grapefruit TV release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [[ "${VERSION,,}" =~ (alpha|beta|rc) ]]; then flags+=(--prerelease); fi
          notes="docs/tv/releases/$VERSION.md"
          test -f "$notes"
          gh release create "tv-v$VERSION" "grapefruit-tv-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "Grapefruit TV $VERSION" --notes-file "$notes" "${flags[@]}"
      - name: Publish to the F-Droid repo
        # A stable release goes into Grapefruit's F-Droid repo beside Music (prereleases stay out).
        if: ${{ !contains(needs.build.outputs.version, 'alpha') && !contains(needs.build.outputs.version, 'beta') && !contains(needs.build.outputs.version, 'rc') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml --ref "$GITHUB_REF_NAME"
