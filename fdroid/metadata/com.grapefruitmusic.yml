# com.grapefruitmusic/en-US/changelogs/<versionCode>.txt: the workflow uses it as the GitHub
# release notes, and fdroidserver puts it in the index-v1 "What's new" (for a repo of prebuilt
# APKs, fdroidserver 2.4 leaves it out of index-v2). Categories are defined in config/categories.yml.
# The workflow adds CurrentVersionCode (the newest APK in the repo) before running fdroid update.
