name: Grapefruit FAST
on:
  push:
    paths: ["fast/**", "grapefruit-ui/**", "tools/fast/**", "docs/fast/**", "build.gradle", "settings.gradle", "gradle.properties", "gradle/**", ".github/workflows/fast.yml"]
  pull_request:
    paths: ["fast/**", "grapefruit-ui/**", "tools/fast/**", "docs/fast/**", "build.gradle", "settings.gradle", "gradle.properties", "gradle/**", ".github/workflows/fast.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed GitHub release from the default branch
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test stream checker (offline)
        run: python3 -m unittest discover -s tools/fast -p 'test_*.py' -v
      - name: Read FAST version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\([^"]*\)" *$/\1/p' fast/build.gradle)
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: FAST signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_FAST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit-fast.p12"
            echo "GRAPEFRUIT_FAST_KEYSTORE=$RUNNER_TEMP/grapefruit-fast.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, test and lint FAST
        env:
          GRAPEFRUIT_FAST_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_FAST_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :fast:assembleDebug :fast:assembleRelease :fast:testDebugUnitTest :fast:lintDebug
      - name: Package installable test APK
        run: |
          mkdir -p work/fast-test-apk
          apk=work/fast-test-apk/grapefruit-fast-1.0-beta-1-test.apk
          cp fast/build/outputs/apk/debug/fast-debug.apk "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 17 "$apk" > work/fast-test-apk/signature.txt
          "$tools/aapt2" dump badging "$apk" > work/fast-test-apk/package.txt
          (cd work/fast-test-apk && sha256sum grapefruit-fast-1.0-beta-1-test.apk > SHA256SUMS)
          cp docs/fast/validation.md work/fast-test-apk/verification.md
          cp docs/fast/stream-report.json docs/fast/codec-report.json work/fast-test-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-fast-1.0-beta-1-test-apk
          path: work/fast-test-apk/
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit-fast.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-fast-apk
          path: fast/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grapefruit-fast-reports
          path: |
            fast/build/reports/
            fast/build/test-results/
          if-no-files-found: ignore
  release:
    # Explicit publication prevents an unrelated shared-library change releasing FAST.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require permanent FAST key
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: test "$SIGNED" = true
      - uses: actions/download-artifact@v4
        with:
          name: grapefruit-fast-apk
          path: artifacts
      - name: Verify package and signature
        env:
          EXPECTED_CERT: ${{ vars.GRAPEFRUIT_FAST_CERT_SHA256 }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$EXPECTED_CERT"
          apk=artifacts/release/fast-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          digest=$("$tools/apksigner" verify --print-certs --min-sdk-version 17 "$apk" | sed -n 's/^.*certificate SHA-256 digest: *//p' | sort -u)
          test "$digest" = "$EXPECTED_CERT"
          "$tools/aapt2" dump badging "$apk" > badging.txt
          head -n 1 badging.txt | grep -qF "package: name='io.github.hayliewordsman.grapefruitfast'"
          cp "$apk" "grapefruit-fast-$VERSION.apk"
      - name: Publish FAST release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [[ "${VERSION,,}" =~ (alpha|beta|rc) ]]; then flags+=(--prerelease); fi
          notes="docs/fast/releases/$VERSION.md"
          test -f "$notes"
          gh release create "fast-v$VERSION" "grapefruit-fast-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "Grapefruit FAST $VERSION" --notes-file "$notes" "${flags[@]}"
