name: Grapefruit AI debug APK

# Builds on GitHub-hosted runners only (no Android SDK or Gradle on any self-hosted server).
on:
  push:
    branches: [grapefruit-ai-android-4.2.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapefruit-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK (ANDROID_HOME); AGP fetches platform 35 if needed.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and API 17 (Robolectric) tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (includes NewApi checks against minSdk 17)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: APK facts
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grapefruit-ai-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

  # A rolling pre-release with the newest debug APK, downloadable without signing in to GitHub:
  # https://github.com/<owner>/<repo>/releases/download/grapefruit-ai-debug/grapefruit-ai-debug.apk
  # Only for pushes and manual runs on the Grapefruit AI branch; only this job can write.
  prerelease:
    needs: debug
    if: github.ref == 'refs/heads/grapefruit-ai-android-4.2.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: grapefruit-ai-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grapefruit-ai-debug-apk
          path: apk

      - name: Publish debug pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG=grapefruit-ai-debug
          cp apk/*.apk grapefruit-ai-debug.apk
          SHORT=${SHA:0:7}
          NOTES="Debug build of Grapefruit AI from grapefruit-ai-android-4.2.2 at ${SHORT}.

          Signed with a debug key: uninstall it before installing a release-signed build.
          Built by ${RUN_URL}
          This pre-release is replaced on every push to the branch."
          # Replace the previous rolling pre-release and its tag (only this workflow's own tag).
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" grapefruit-ai-debug.apk --repo "$REPO" --target "$SHA" \
            --prerelease --title "Grapefruit AI debug (${SHORT})" --notes "$NOTES"
