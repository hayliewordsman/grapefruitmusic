name: Grapefruit AI release APK

# Manual only, and separate from debug builds. Signs only when the repository has the
# GRAPEFRUIT_AI_KEYSTORE_BASE64 and GRAPEFRUIT_AI_KEYSTORE_PASSWORD secrets; otherwise the
# release APK is left unsigned. The key never reaches the repository or the logs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grapefruit-ai-android-4.2.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_AI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit-ai.p12"
            echo "GRAPEFRUIT_AI_KEYSTORE=$RUNNER_TEMP/grapefruit-ai.p12" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the release APK will be unsigned."
          fi

      - name: Test and build release APK
        env:
          GRAPEFRUIT_AI_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_AI_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit-ai.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
