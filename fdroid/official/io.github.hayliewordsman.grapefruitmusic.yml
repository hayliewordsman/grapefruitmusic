MaintainerNotes: |-
  app/src/main/assets/karaoke.bin (SHA-256 1bd3f3d8f19418edeea619d304fa15894d8492eb07758022840db05a6171cee0)
  is the weights of Karaoke Mode's small vocal-separation network: data read by
  VocalRemover.Model.read, not executable code. tools/karaoke (README-v4.md, stereo_v4.py) trained it
  from scratch on the SiSEC18-MUS 7-second excerpts only (CC BY 4.0, https://zenodo.org/records/3270814);
  its manifest is app/src/main/assets/karaoke_training.json and the app credits the excerpts.
  app/src/main/assets/live_crowd.bin (SHA-256 6af6474050623f3533b4b702b69a327e06f52950841653ab01480dbf1b1ae7f7)
  is Live Mode's crowd sound: mu-law audio synthesized by tools/live/render_crowd.py from noise and
  arithmetic (no recordings), read by LiveCrowd.read; GPL-3.0-or-later like the app, manifest
  app/src/main/assets/live_crowd.json.
  app/src/main/assets/fonts holds Geist and a subset of Geist Pixel (Vercel, SIL OFL 1.1; the licence
  is beside them). app/src/test/resources holds unit-test fixtures only.
  NonFreeNet: podcast search and charts use Apple's directory (itunes.apple.com search and lookup,
  rss.applemarketingtools.com); playing and subscribing use each podcast's own RSS feed.

