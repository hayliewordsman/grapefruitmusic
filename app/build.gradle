plugins {
    id "com.android.application"
}

android {
    namespace "com.grapefruitmusic"
    compileSdk 35

    defaultConfig {
        applicationId "com.grapefruitmusic"
        // Android 4.2.2 (Jelly Bean MR1).
        minSdk 17
        // Kept below 23 on purpose: Grapefruit Music is built for Android 4.2.2 and uses
        // install-time permissions. Android 14+ refuses to install apps targeting < 23.
        targetSdk 22
        versionCode 24
        versionName "3.1"

        ndk {
            // Conscrypt ships native code; these are the ABIs Android 4.2.2 phones use.
            abiFilters "armeabi-v7a", "x86"
        }
    }

    signingConfigs {
        // The permanent release key, kept out of the repository. Builds find it through
        // GRAPEFRUIT_KEYSTORE (path to the .p12 file) and GRAPEFRUIT_KEYSTORE_PASSWORD.
        release {
            def keystore = System.getenv("GRAPEFRUIT_KEYSTORE")
            if (keystore) {
                storeFile = file(keystore)
                storeType = "pkcs12"
                storePassword = System.getenv("GRAPEFRUIT_KEYSTORE_PASSWORD")
                keyAlias = "grapefruit"
                keyPassword = System.getenv("GRAPEFRUIT_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the release key (forks, pull requests) the debug key still makes an
            // installable APK, but it can't update copies signed with the release key.
            signingConfig System.getenv("GRAPEFRUIT_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // The low targetSdk is deliberate (see defaultConfig).
        disable "ExpiredTargetSdkVersion", "OldTargetApi"
        abortOnError true
    }
}

dependencies {
    // Modern TLS (1.2/1.3, AEAD ciphers) on Android 4.2.2, whose built-in TLS stack
    // can't talk to most HTTPS servers any more.
    implementation "org.conscrypt:conscrypt-android:2.5.3"

    testImplementation "junit:junit:4.13.2"
}
