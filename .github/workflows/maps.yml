name: Grapefruit Maps
on:
  push:
    paths: ["maps/**", "grapefruit-ui/**", "tools/maps/**", "settings.gradle", "build.gradle", "gradle/**", ".github/workflows/maps.yml"]
  pull_request:
    paths: ["maps/**", "grapefruit-ui/**", "tools/maps/**", "settings.gradle", "build.gradle", "gradle/**", ".github/workflows/maps.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK and offline map test fixture
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          mkdir -p work/maps-beta
          curl --fail --location --retry 3 https://download.mapsforge.org/maps/v5/europe/andorra.map -o work/maps-beta/andorra.map
      - name: Use permanent Grapefruit certificate when available
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit.p12"
            echo "GRAPEFRUIT_KEYSTORE=$RUNNER_TEMP/grapefruit.p12" >> "$GITHUB_ENV"
          fi
      - name: Build beta, test and lint
        env:
          GRAPEFRUIT_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :maps:assembleBeta :maps:testBetaUnitTest :maps:lintBeta
      - name: Verify installable Android 4.2.2 APK
        run: |
          mkdir -p work/maps-apk
          cp maps/build/outputs/apk/beta/maps-beta.apk work/maps-apk/grapefruit-maps-1.0-beta1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 17 work/maps-apk/grapefruit-maps-1.0-beta1.apk > work/maps-apk/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging work/maps-apk/grapefruit-maps-1.0-beta1.apk > work/maps-apk/package.txt
          if [ -n "$GRAPEFRUIT_KEYSTORE" ]; then
            digest=$(sed -n 's/^.*certificate SHA-256 digest: *//p' work/maps-apk/signature.txt | sort -u)
            test "$digest" = 85cac0ef72777211d99e2bbe4ad09a3815c6cf313e5fa18f401ec8da0ae0e795
          fi
          cd work/maps-apk
          sha256sum grapefruit-maps-1.0-beta1.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: grapefruit-maps-1.0-beta1
          path: work/maps-apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grapefruit-maps-reports
          path: |
            maps/build/reports/
            maps/build/test-results/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit.p12"
