name: Grapefruit OS source validation
on:
  push:
    branches: [grapefruit-os-jp5s-4.2.2]
    paths: ["os/**", "grapefruit-media/**", "app/**", "tv/**", "maps/**", "launcher/**", "keyboard/**", "calculator/**", "grapefruit-ui/**", "settings.gradle", "gradle.properties", ".github/workflows/grapefruit-os-validation.yml"]
  pull_request:
    paths: ["os/**", "grapefruit-media/**", "app/**", "tv/**", "maps/**", "launcher/**", "keyboard/**", "calculator/**", "grapefruit-ui/**", "settings.gradle", "gradle.properties", ".github/workflows/grapefruit-os-validation.yml"]
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download original Android API 17 and Java 6-capable compiler
        run: |
          mkdir -p work/os-ci
          curl -fLsS https://dl.google.com/android/repository/android-17_r03.zip -o work/os-ci/android17.zip
          curl -fLsS https://repo.maven.apache.org/maven2/org/eclipse/jdt/core/compiler/ecj/4.6.1/ecj-4.6.1.jar -o work/os-ci/ecj.jar
          sha256sum -c os/validation-tools.sha256
          unzip -q work/os-ci/android17.zip -d work/os-ci/sdk
      - name: Validate native additions and behavior
        run: python3 os/scripts/validate.py --android-jar work/os-ci/sdk/android-4.2.2/android.jar --ecj work/os-ci/ecj.jar
      - name: Validate patches against original AOSP
        run: |
          python3 os/scripts/fetch_aosp_references.py --output work/os-ci/aosp
          python3 os/scripts/apply_sources.py --aosp-root work/os-ci/aosp
      # No proprietary inputs, signing secrets, device access, images or publishing steps.
  apps-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # setup-android's default also requests the retired SDK package named "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install application compilation SDKs
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile application Java and test Media themes
        run: |
          ./gradlew -PgrapefruitSkipKeyboard :app:compileDebugJavaWithJavac :tv:compileDebugJavaWithJavac :maps:compileDebugJavaWithJavac :launcher:compileDebugJavaWithJavac :calculator:compileDebugJavaWithJavac :grapefruit-media:testDebugUnitTest --no-daemon
      # Keyboard JNI is covered by the separately recorded local NDK 17 build, not this job.
