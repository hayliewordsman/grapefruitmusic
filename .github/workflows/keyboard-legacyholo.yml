name: Grapefruit keyboard LegacyHolo
on:
  push:
    branches: [codex/grapefruit-keyboard-legacyholo]
    paths: ["keyboard/**", "grapefruit-ui/**", "*.gradle", "gradle.properties", ".github/workflows/keyboard-legacyholo.yml"]
  pull_request:
    paths: ["keyboard/**", "grapefruit-ui/**", "*.gradle", "gradle.properties", ".github/workflows/keyboard-legacyholo.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install legacy native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;17.2.4988734"
      - name: Test, lint and build
        run: ./gradlew :keyboard:testDebugUnitTest :keyboard:lintDebug :keyboard:assembleDebug :keyboard:assembleRelease --no-daemon --max-workers=3
      - uses: actions/upload-artifact@v4
        with:
          name: Grapefruit-keyboard-LegacyHolo-1.0-beta1-test-and-unsigned-release
          path: keyboard/build/outputs/apk/**/*.apk
