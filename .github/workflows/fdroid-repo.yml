name: F-Droid repo

# Publishes Grapefruit Music and Grapefruit TV (formerly Grapefruit FAST) as an F-Droid repository on GitHub Pages:
# https://hayliewordsman.github.io/grapefruitmusic/repo (setting it up: fdroid/README.md).
#
# 1. Release: if the default branch's version (app/build.gradle) has no GitHub release yet, builds
#    the release APK from the commit this run is on, checks it is signed with the permanent app key,
#    and publishes it as release v<versionName> tagged on that commit. f-droid.org's recipe builds
#    the same commit and compares its APK with this one (reproducible builds). An alpha, beta or rc
#    versionName makes a prerelease, which stays out of the F-Droid repo.
#    Grapefruit TV makes its own releases (tv-v<versionName>; fast-v<versionName> before 2.0;
#    .github/workflows/tv.yml) and runs this workflow when it publishes one; this job never builds
#    or releases Grapefruit TV.
# 2. Publish: puts every release's APK (Music's v*, Grapefruit TV's tv-v* and fast-v*) into the F-Droid repo, signs the repo's index with the repo
#    key (fdroid/config.yml) and deploys it to GitHub Pages.
#
# It runs when the version, the listing (fdroid/) or this file changes on the default branch, and
# by hand: Actions › F-Droid repo › Run workflow.

on:
  push:
    branches: ["**"] # not tags
    paths:
      - app/build.gradle
      - fastlane/**
      - tv/fastlane/**
      - fdroid/**
      - .github/workflows/fdroid-repo.yml
  workflow_dispatch:
    inputs:
      repository_only:
        description: Update the repository without building or publishing either original app
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, and a run that has started always finishes (no half-published repo).
concurrency:
  group: fdroid-repo
  cancel-in-progress: false

env:
  APP_ID: io.github.hayliewordsman.grapefruitmusic
  # Grapefruit TV, published in the same repo. Signed with the same permanent Grapefruit key. (Its
  # application ID keeps the name it had as Grapefruit FAST, so updates install over 1.0.)
  TV_ID: io.github.hayliewordsman.grapefruitfast
  BLUE_ID: io.github.hayliewordsman.bluegrapefruit.victory
  # Blue retains its own certificate, including when updating its test builds to stable.
  BLUE_CERT_SHA256: 1b8ccaa8d7dbdcf6327eb5473f7adc73a531eadb399c8e080a605b35b722ef34
  REPO_CERT_SHA256: 33AAF333079D68BD79F59463B59E33585E4EF7CB4E9F6722CE1F1281F93940F4
  # SHA-256 of the certificate every Grapefruit Music release is signed with. An APK signed with
  # anything else is never released or published.
  APP_CERT_SHA256: 85cac0ef72777211d99e2bbe4ad09a3815c6cf313e5fa18f401ec8da0ae0e795
  FDROIDSERVER_VERSION: 2.4.5

jobs:
  release:
    name: Release the APK
    if: github.ref_name == github.event.repository.default_branch && !(github.event_name == 'workflow_dispatch' && inputs.repository_only)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the release and its tag
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(sed -n 's/^ *versionCode \([0-9][0-9]*\) *$/\1/p' app/build.gradle)
          name=$(sed -n 's/^ *versionName "\([^"]*\)" *$/\1/p' app/build.gradle)
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "::error file=app/build.gradle::Can't read versionCode and versionName."
            exit 1
          fi
          tag="v${name// /-}"
          if [[ "${name,,}" =~ (alpha|beta|rc) ]]; then prerelease=true; else prerelease=false; fi
          if out=$(gh release view "$tag" --json tagName 2>&1); then
            exists=true
          elif grep -q "release not found" <<<"$out"; then
            exists=false
          else
            echo "$out"
            exit 1
          fi
          echo "Version $name ($code), tag $tag, prerelease $prerelease, already released: $exists"
          {
            echo "code=$code"
            echo "name=$name"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      # JDK 21, as f-droid.org's build recipe installs: javac's output differs between JDK versions, and
      # f-droid.org only ships this APK if its own build of the same commit matches it.
      - uses: actions/setup-java@v5
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - name: App signing key
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAPEFRUIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the GRAPEFRUIT_KEYSTORE_BASE64 and GRAPEFRUIT_KEYSTORE_PASSWORD secrets (see fdroid/README.md): releases must carry the permanent app key."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grapefruit.p12"
          echo "GRAPEFRUIT_KEYSTORE=$RUNNER_TEMP/grapefruit.p12" >> "$GITHUB_ENV"

      - name: Build and test
        if: steps.version.outputs.exists == 'false'
        env:
          GRAPEFRUIT_KEYSTORE_PASSWORD: ${{ secrets.GRAPEFRUIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest

      - name: Remove the app signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grapefruit.p12"

      - name: Check the APK
        id: apk
        if: steps.version.outputs.exists == 'false'
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          certs=$("$tools/apksigner" verify --print-certs --min-sdk-version 17 "$apk")
          # Every signer's certificate, however this apksigner labels it ("Signer #1", "V2 Signer"):
          # there must be exactly one, the app key.
          digests=$(sed -n 's/^.*certificate SHA-256 digest: *//p' <<<"$certs" | sort -u)
          if [ "$digests" != "$APP_CERT_SHA256" ]; then
            echo "$certs"
            echo "::error::The APK isn't signed with the permanent app key ($APP_CERT_SHA256)."
            exit 1
          fi
          badging=$("$tools/aapt2" dump badging "$apk" | head -n 1)
          if ! grep -qF "package: name='$APP_ID' versionCode='$CODE' versionName='$NAME'" <<<"$badging"; then
            echo "$badging"
            echo "::error::The APK's package or version doesn't match app/build.gradle."
            exit 1
          fi
          out="$RUNNER_TEMP/grapefruit-audio-${NAME// /-}.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The release notes are the F-Droid changelog for this version, when there is one.
          notes=fastlane/metadata/android/en-US/changelogs/$CODE.txt
          if [ -f "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/notes.md"
          else
            echo "Grapefruit Audio $NAME" > "$RUNNER_TEMP/notes.md"
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # Tagged on the commit this run built. (GitHub doesn't let a workflow's token tag an older
          # commit whose workflow files differ from the current ones.)
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Grapefruit Audio $NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  publish:
    name: Publish the F-Droid repo
    needs: release
    if: ${{ always() && !cancelled() && github.ref_name == github.event.repository.default_branch && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.repository_only && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write # deploys to GitHub Pages
      id-token: write # proves the deployment comes from this workflow
      actions: read # deploy-pages reads the uploaded site
    # The repo key's secrets live in this environment, which only the default branch can use.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}repo/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install fdroidserver
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroidserver"
          "$RUNNER_TEMP/fdroidserver/bin/pip" install --quiet "fdroidserver==$FDROIDSERVER_VERSION"
          echo "$RUNNER_TEMP/fdroidserver/bin" >> "$GITHUB_PATH"

      - name: Snapshot the original catalog
        if: github.event_name == 'workflow_dispatch' && inputs.repository_only
        run: |
          python -c 'import urllib.request,sys; urllib.request.urlretrieve("https://hayliewordsman.github.io/grapefruitmusic/repo/index-v2.json", sys.argv[1])' "$RUNNER_TEMP/original-index-v2.json"
          python -c 'import urllib.request,sys; urllib.request.urlretrieve("https://hayliewordsman.github.io/grapefruitmusic/archive/index-v2.json", sys.argv[1])' "$RUNNER_TEMP/original-archive-index-v2.json"

      - name: Collect the released APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid/repo "$RUNNER_TEMP/apks"
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName,publishedAt --jq '.[] | select((.tagName | startswith("v")) or (.tagName | startswith("tv-v")) or (.tagName | startswith("fast-v")) or (.tagName | startswith("blue-v"))) | "\(.tagName) \(.publishedAt)"' > "$RUNNER_TEMP/releases.txt"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          while read -r tag published; do
            dir="$RUNNER_TEMP/apks/$tag"
            if ! gh release download "$tag" --pattern '*.apk' --dir "$dir"; then
              if [[ "$tag" == blue-v* ]]; then
                # Blue's public APK-only tags also work when release-asset upload is unavailable.
                python fdroid/blue_release.py fetch "$tag" "$dir"
              else
                echo "::warning::Release $tag has no APK, so it's left out."
                continue
              fi
            fi
            for apk in "$dir"/*.apk; do
              digests=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: *//p' | sort -u)
              expected_cert="$APP_CERT_SHA256"
              if [[ "$tag" == blue-v* ]]; then
                expected_cert="$BLUE_CERT_SHA256"
                badging=$("$tools/aapt2" dump badging "$apk" | head -n 1)
                if [[ "$badging" != "package: name='$BLUE_ID' "* ]]; then
                  echo "::error::$tag must contain only the Blue Grapefruit package."
                  exit 1
                fi
              fi
              if [ "$digests" != "$expected_cert" ]; then
                echo "::error::$tag: $(basename "$apk") isn't signed with the permanent app key."
                exit 1
              fi
              # The day the release came out becomes the version's date in F-Droid.
              touch -d "$published" "$apk"
              mv -n "$apk" fdroid/repo/
            done
          done < "$RUNNER_TEMP/releases.txt"
          if ! ls fdroid/repo/*.apk >/dev/null 2>&1; then
            echo "::error::No release has an APK yet."
            exit 1
          fi
          ls -l fdroid/repo

      - name: Prepare the listings
        run: |
          # Each app's listing (f-droid.org reads Music's too): name, summary, description, icon and changelogs.
          # Clients suggest each app's newest version, and its changelogs/<versionCode>.txt is the "What's new".
          # The newest is counted per app: Grapefruit TV's version codes never count towards Music's, or the reverse.
          for entry in "$APP_ID:fastlane" "$TV_ID:tv/fastlane" "$BLUE_ID:blue-victory/fastlane"; do
            app=${entry%%:*}; listing=${entry#*:}
            mkdir -p "fdroid/metadata/$app"
            cp -r "$listing/metadata/android/." "fdroid/metadata/$app/"
            code=$(python -c 'import sys; from fdroidserver import common; ids=[common.get_apk_id(f) for f in sys.argv[2:]]; codes=[int(c) for (p, c, n) in ids if p == sys.argv[1]]; print(max(codes) if codes else "")' "$app" fdroid/repo/*.apk)
            if [ -n "$code" ]; then
              printf '\nCurrentVersionCode: %s\n' "$code" >> "fdroid/metadata/$app.yml"
              echo "$app: newest version $code"
            else
              echo "$app: no release in the repo yet"
            fi
          done

      - name: Repo signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the FDROID_KEYSTORE_BASE64 and FDROID_KEYSTORE_PASSWORD secrets to the github-pages environment (see fdroid/README.md)."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > fdroid/keystore.p12
          chmod 600 fdroid/config.yml

      - name: Build and sign the repo index
        id: index
        working-directory: fdroid
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          cp ../docs/icon.png icon.png
          fdroid update --rename-apks --use-date-from-apk --pretty
          jarsigner -verify repo/entry.jar | grep -q '^jar verified'
          fingerprint=$(keytool -list -v -keystore keystore.p12 -storetype PKCS12 -alias grapefruit-repo \
            -storepass:env FDROID_KEYSTORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':')
          test "$fingerprint" = "$REPO_CERT_SHA256"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          {
            echo "### F-Droid repo"
            echo
            echo "Share https://hayliewordsman.github.io/grapefruitmusic/: its Add to F-Droid button adds the repo."
            echo
            echo "Or add it in F-Droid with this link (the fingerprint pins the repo signing key):"
            echo
            echo "https://hayliewordsman.github.io/grapefruitmusic/repo?fingerprint=$fingerprint"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the original app entries
        if: github.event_name == 'workflow_dispatch' && inputs.repository_only
        run: |
          python fdroid/blue_release.py verify-originals "$RUNNER_TEMP/original-index-v2.json" fdroid/repo/index-v2.json
          python fdroid/blue_release.py verify-originals-archive "$RUNNER_TEMP/original-archive-index-v2.json" fdroid/archive/index-v2.json

      - name: Remove the repo signing key
        if: always()
        run: rm -f fdroid/keystore.p12

      - name: Assemble the site
        env:
          FINGERPRINT: ${{ steps.index.outputs.fingerprint }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -r fdroid/repo "$site/repo"
          if [ -d fdroid/archive ]; then cp -r fdroid/archive "$site/archive"; fi
          # The front page: an "Add to F-Droid" button, the APK for older devices, and a QR code.
          cp docs/icon.png "$site/icon.png"
          cp docs/brand/logo-stacked.svg docs/brand/logo-stacked-dark.svg "$site/"
          python fdroid/site/render.py fdroid/site/index.html fdroid/repo/index-v2.json "$APP_ID" \
            "$FINGERPRINT" https://hayliewordsman.github.io/grapefruitmusic/ "$site"
          # Blue has its own page. The existing Audio front page and TV listing are unchanged.
          mkdir -p "$site/blue"
          cp blue-victory/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$site/blue/icon.png"
          cp blue-victory/brand/logo-stacked.svg blue-victory/brand/logo-stacked-dark.svg "$site/blue/"
          python fdroid/site/render.py blue-victory/site/index.html fdroid/repo/index-v2.json "$BLUE_ID" \
            "$FINGERPRINT" https://hayliewordsman.github.io/grapefruitmusic/blue/ "$site/blue"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
